version: "3.9"

# HYBRID DEVELOPMENT SETUP
# Use this for local development: database in Docker, backend/frontend run locally
# Command: docker compose -f docker-compose.db-only.yml up

services:
  db:
    image: postgres:15
    container_name: thinkback_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT}:5435"

volumes:
  postgres_data:
